<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cascade</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pbg-checker">

<div class="controls">
    <div class="brand">
        <h3>
            <span class="logo">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="3" width="16" height="8" rx="2"/>
                    <rect x="4" y="13" width="16" height="8" rx="2"/>
                </svg>
            </span>
            Cascade
        </h3>
        <button id="themeToggle" class="icon-btn" title="Toggle light / dark" aria-label="Toggle theme"></button>
    </div>

    <div id="status" class="status"><span class="dot"></span><span id="statusText">Drop an image to begin</span></div>

    <div class="card">
        <div class="card-row">
            <span class="card-label">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="2"/>
                    <line x1="4" y1="9" x2="20" y2="9"/>
                    <line x1="4" y1="15" x2="20" y2="15"/>
                </svg>
                Margin
            </span>
            <input type="number" id="margin" value="150">
        </div>
        <div class="slider-wrap">
            <input type="range" id="marginSlider" min="0" max="300" value="150">
            <div class="bubble"></div>
        </div>
    </div>

    <div class="card">
        <span class="card-label">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="4" x2="12" y2="20"/>
                <polyline points="8 8 12 4 16 8"/>
                <polyline points="8 16 12 20 16 16"/>
            </svg>
            Vertical offset
        </span>
        <div class="offset-modes" id="offsetModes">
            <button type="button" data-mode="top" title="Align top">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="4" x2="20" y2="4"/>
                    <rect x="8" y="9" width="8" height="11" rx="1.5"/>
                </svg>
            </button>
            <button type="button" data-mode="center" class="active" title="Center">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="12" x2="20" y2="12"/>
                    <rect x="8" y="6.5" width="8" height="11" rx="1.5"/>
                </svg>
            </button>
            <button type="button" data-mode="bottom" title="Align bottom">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="20" x2="20" y2="20"/>
                    <rect x="8" y="4" width="8" height="11" rx="1.5"/>
                </svg>
            </button>
            <button type="button" data-mode="custom" title="Custom offset">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="8" x2="20" y2="8"/>
                    <circle cx="15" cy="8" r="2.6" fill="currentColor" stroke="none"/>
                    <line x1="4" y1="16" x2="20" y2="16"/>
                    <circle cx="9" cy="16" r="2.6" fill="currentColor" stroke="none"/>
                </svg>
            </button>
        </div>
        <div class="offset-value-row">
            <input type="number" id="offset" value="0">
            <span class="unit">px</span>
        </div>
        <div class="slider-wrap">
            <input type="range" id="offsetSlider" min="-500" max="500" value="0">
            <div class="bubble"></div>
        </div>
    </div>

    <div class="card">
        <span class="card-label">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="4" width="16" height="7" rx="1.5"/>
                <rect x="4" y="13" width="16" height="7" rx="1.5" opacity=".5"/>
            </svg>
            Alpha curve
        </span>
        <div class="offset-modes seam-modes" id="seamModes">
            <button type="button" data-blend="top" title="Top alpha comes in sooner" aria-label="Top alpha comes in sooner">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="7 9 12 4 17 9"/>
                    <rect x="6" y="12" width="12" height="8" rx="1.5"/>
                </svg>
                Top
            </button>
            <button type="button" data-blend="equal" class="active" title="Balanced alpha curve" aria-label="Balanced alpha curve">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="6" y1="9" x2="18" y2="9"/>
                    <line x1="6" y1="15" x2="18" y2="15"/>
                </svg>
                Both
            </button>
            <button type="button" data-blend="bottom" title="Bottom alpha remains longer" aria-label="Bottom alpha remains longer">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="6" y="4" width="12" height="8" rx="1.5"/>
                    <polyline points="7 15 12 20 17 15"/>
                </svg>
                Bottom
            </button>
        </div>
    </div>

    <div class="card">
        <span class="card-label">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 5h10"/>
                <path d="M7 19h10"/>
                <path d="M12 8v8"/>
                <polyline points="9 11 12 8 15 11"/>
                <polyline points="9 13 12 16 15 13"/>
            </svg>
            Trim from
        </span>
        <div class="offset-modes seam-modes" id="trimModes">
            <button type="button" data-trim="bottom" class="active" title="Preserve the top; trim from the bottom" aria-label="Preserve the top; trim from the bottom">Bottom</button>
            <button type="button" data-trim="both" title="Trim evenly from both ends" aria-label="Trim evenly from both ends">Both</button>
            <button type="button" data-trim="top" title="Preserve the bottom; trim from the top" aria-label="Preserve the bottom; trim from the top">Top</button>
        </div>
    </div>

    <div class="card pbg-card">
        <span class="card-label">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <path d="M3 15l5-4 4 3 3-2 6 4"/>
            </svg>
            Preview background
        </span>
        <div class="offset-modes" id="pbgModes">
            <button type="button" data-bg="checker" class="active swatch-checker" title="Checkerboard" aria-label="Checkerboard background"></button>
            <button type="button" data-bg="white" class="swatch-white" title="White" aria-label="White background"></button>
            <button type="button" data-bg="black" class="swatch-black" title="Black" aria-label="Black background"></button>
        </div>
    </div>

    <div class="card">
        <div class="card-row">
            <span class="card-label">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="3" width="14" height="7" rx="1.5"/>
                    <rect x="5" y="14" width="14" height="7" rx="1.5"/>
                </svg>
                Repeats <span style="color:var(--muted);font-weight:500;">(preview)</span>
            </span>
            <input type="number" id="repeat" value="2" min="1" max="5">
        </div>
        <div class="slider-wrap">
            <input type="range" id="repeatSlider" min="1" max="5" value="2">
            <div class="bubble"></div>
        </div>
    </div>

    <div class="download-wrap">
        <button id="download" disabled>
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 4v11"/>
                <polyline points="7 11 12 16 17 11"/>
                <path d="M5 20h14"/>
            </svg>
            Download
        </button>
        <div class="output-stamp" id="outputStamp"></div>
    </div>

    <div class="version-container">
        <span class="version">v2.3.0</span>
    </div>
</div>

<div class="preview-grid">
    <div class="canvas-box left">
        <span class="canvas-tag left-tag">Result</span>
        <canvas id="canvas"></canvas>
    </div>

    <div class="canvas-box right zoom-wrapper" id="canvas-box-right">
        <span class="canvas-tag right-tag">Seam preview</span>
        <div class="canvas-inner">
            <canvas id="canvasRepeat"></canvas>
        </div>
    </div>

    <div class="empty-state">
        <div class="drop-ring">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <circle cx="8.5" cy="8.5" r="1.6"/>
                <path d="M21 15l-5-5L5 21"/>
            </svg>
        </div>
        <h4>Drop an image to begin</h4>
        <p>Drag &amp; drop anywhere — margin, offset and repeats update live</p>
    </div>
</div>

<div class="drop-overlay" id="overlay">
    <div class="overlay-content">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4"/>
            <polyline points="7 9 12 4 17 9"/>
            <path d="M5 20h14"/>
        </svg>
        Drop image anywhere
    </div>
</div>

<div id="dragChip"></div>

<script src="app.js"></script>

</body>
</html>
