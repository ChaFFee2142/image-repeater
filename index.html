<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Repeater</title>
    <style>

        /* ---------- Palette (light is the base; dark overrides below) ---------- */
        :root {
            --bg: #e9ebf1;             /* soft gray page, not blinding white */
            --panel: #f7f8fb;          /* card / surface */
            --panel-2: #eef0f5;        /* inset controls */
            --track: #d9dce4;          /* slider rail */
            --text: #23262e;
            --muted: #737a88;
            --border: rgba(20, 24, 40, 0.10);
            --border-strong: rgba(20, 24, 40, 0.16);
            --accent: #5b6cf0;
            --accent-hover: #4a5be6;
            --accent-soft: rgba(91, 108, 240, 0.12);
            --on-accent: #ffffff;
            --shadow-sm: 0 1px 2px rgba(20, 25, 45, 0.08);
            --shadow-md: 0 6px 20px rgba(20, 25, 45, 0.10);
            --shadow-lg: 0 18px 48px rgba(20, 25, 45, 0.16);
            --radius: 18px;
        }

        /* Dark via system preference (unless user forced light) */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0c0e13;
                --panel: #15181f;
                --panel-2: #1b1f28;
                --track: #2a303c;
                --text: #e7e9ee;
                --muted: #8b93a3;
                --border: rgba(255, 255, 255, 0.08);
                --border-strong: rgba(255, 255, 255, 0.15);
                --accent: #7c8cff;
                --accent-hover: #8f9dff;
                --accent-soft: rgba(124, 140, 255, 0.16);
                --on-accent: #0c0e13;
                --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
                --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
                --shadow-lg: 0 22px 60px rgba(0, 0, 0, 0.55);
            }
        }

        /* Dark forced by toggle */
        :root[data-theme="dark"] {
            --bg: #0c0e13;
            --panel: #15181f;
            --panel-2: #1b1f28;
            --track: #2a303c;
            --text: #e7e9ee;
            --muted: #8b93a3;
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.15);
            --accent: #7c8cff;
            --accent-hover: #8f9dff;
            --accent-soft: rgba(124, 140, 255, 0.16);
            --on-accent: #0c0e13;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
            --shadow-lg: 0 22px 60px rgba(0, 0, 0, 0.55);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            display: flex;
            height: 100vh;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            transition: background 0.25s ease, color 0.25s ease;
        }

        /* ---------- Sidebar ---------- */
        .controls {
            width: 336px;
            flex: 0 0 336px;
            padding: 20px;
            border-right: 1px solid var(--border);
            background: var(--panel);
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .brand h3 {
            margin: 0;
            font-size: 17px;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .brand .logo {
            width: 26px; height: 26px;
            border-radius: 8px;
            background: linear-gradient(140deg, var(--accent), var(--accent-hover));
            display: grid; place-items: center;
            color: var(--on-accent);
            box-shadow: var(--shadow-sm);
        }

        .icon-btn {
            width: 34px; height: 34px;
            padding: 0;
            display: grid; place-items: center;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--muted);
            cursor: pointer;
            transition: transform 0.08s ease, background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
        }
        .icon-btn:hover { color: var(--text); background: var(--panel); box-shadow: var(--shadow-sm); }
        .icon-btn:active { transform: translateY(1px) scale(0.96); }

        .card {
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--panel-2);
        }

        .card-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .card-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }
        .card-label svg { color: var(--muted); }

        /* ---------- Status ---------- */
        .status {
            font-size: 13px;
            color: var(--muted);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px dashed var(--border-strong);
            background: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }
        .status .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--muted);
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }
        .status.loaded {
            color: var(--accent);
            border-color: transparent;
            border-style: solid;
            background: var(--accent-soft);
        }
        .status.loaded .dot {
            background: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }

        /* ---------- Number inputs ---------- */
        input[type="number"] {
            width: 78px;
            padding: 7px 9px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            font-size: 14px;
            font-variant-numeric: tabular-nums;
            text-align: right;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        input[type="number"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        /* ---------- Sliders ---------- */
        .slider-wrap {
            position: relative;
            margin-top: 12px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: var(--track);
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-runnable-track { background: transparent; height: 6px; }
        input[type="range"]::-moz-range-track { background: transparent; height: 6px; }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px; height: 18px;
            margin-top: -6px;
            border-radius: 50%;
            background: var(--panel);
            border: 2px solid var(--accent);
            box-shadow: var(--shadow-sm);
            cursor: grab;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        input[type="range"]::-moz-range-thumb {
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--panel);
            border: 2px solid var(--accent);
            box-shadow: var(--shadow-sm);
            cursor: grab;
        }
        input[type="range"]:hover::-webkit-slider-thumb { box-shadow: 0 0 0 6px var(--accent-soft); }
        input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.15); cursor: grabbing; }
        input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--accent-soft); }

        .bubble {
            position: absolute;
            top: -8px;
            transform: translate(-50%, -100%) scale(0.85);
            background: var(--accent);
            color: var(--on-accent);
            font-size: 11px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            padding: 3px 8px;
            border-radius: 7px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.12s ease, transform 0.12s ease;
            box-shadow: var(--shadow-md);
        }
        .bubble::after {
            content: '';
            position: absolute;
            left: 50%; top: 100%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: var(--accent);
        }
        .slider-wrap:hover .bubble,
        .slider-wrap.dragging .bubble {
            opacity: 1;
            transform: translate(-50%, -100%) scale(1);
        }

        /* ---------- Mode buttons ---------- */
        .offset-modes {
            display: flex;
            gap: 6px;
            margin-top: 12px;
        }
        .offset-modes button {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 4px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--muted);
            cursor: pointer;
            transition: transform 0.08s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .offset-modes button:hover { color: var(--text); box-shadow: var(--shadow-sm); }
        .offset-modes button:active { transform: translateY(1px) scale(0.97); }
        .offset-modes button.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
            box-shadow: 0 4px 12px var(--accent-soft);
        }
        .offset-modes button.active:hover { background: var(--accent-hover); }
        .offset-modes button svg { display: block; pointer-events: none; }

        /* Compact, labelled choices used for the seam-layer order. */
        .seam-modes button {
            gap: 5px;
            font-size: 11px;
            font-weight: 700;
        }
        .seam-modes button svg { width: 15px; height: 15px; }

        /* Preview-only transparency backgrounds. The canvas pixels themselves
           stay untouched, so PNG exports retain their alpha channel. */
        .pbg-card .offset-modes button {
            min-height: 34px;
            border-width: 1px;
        }
        .pbg-card .offset-modes button.active {
            box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow-sm);
        }
        .swatch-checker {
            background-color: #f3f4f6 !important;
            background-image:
                linear-gradient(45deg, #b8beca 25%, transparent 25%, transparent 75%, #b8beca 75%),
                linear-gradient(45deg, #b8beca 25%, transparent 25%, transparent 75%, #b8beca 75%) !important;
            background-size: 12px 12px !important;
            background-position: 0 0, 6px 6px !important;
        }
        .swatch-white { background: #fff !important; }
        .swatch-black { background: #111 !important; }

        /* ---------- Offset row (number + reset) ---------- */
        .offset-value-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }
        .offset-value-row .unit { font-size: 12px; color: var(--muted); }

        /* ---------- Download ---------- */
        .download-wrap { margin-top: 4px; }
        #download {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(140deg, var(--accent), var(--accent-hover));
            color: var(--on-accent);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            box-shadow: var(--shadow-md);
            transition: transform 0.08s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }
        #download:hover { filter: brightness(1.05); box-shadow: var(--shadow-lg); }
        #download:active { transform: translateY(1px) scale(0.99); }
        #download:disabled {
            background: var(--panel-2);
            color: var(--muted);
            box-shadow: none;
            cursor: not-allowed;
            filter: none;
        }
        #download svg { pointer-events: none; }

        .output-stamp {
            margin-top: 8px;
            font-size: 12px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            text-align: center;
            min-height: 15px;
        }

        .version-container {
            margin-top: auto;
            padding-top: 16px;
            font-size: 12px;
            color: var(--muted);
            opacity: 0.7;
        }
        .version { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }

        /* ---------- Preview area ---------- */
        .preview-grid {
            position: relative;
            flex: 1;
            display: flex;
            gap: 3%;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow: hidden;
        }

        .canvas-box {
            width: 45%;
            height: calc(100vh - 48px);
            max-height: calc(100vh - 48px);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 16px 16px;
            overflow: hidden;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--panel);
            box-shadow: var(--shadow-md);
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }
        body.has-image .canvas-box:hover { box-shadow: var(--shadow-lg); }

        .canvas-box.right,
        .canvas-box.left { cursor: grab; }
        .canvas-box.dragging { cursor: grabbing !important; border-color: var(--accent); }

        .canvas-box canvas { max-width: 100%; max-height: 100%; }
        .canvas-box.left canvas { height: auto; width: auto; }
        .canvas-box.right .canvas-inner {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .canvas-box.right canvas { width: auto; height: auto; }

        canvas {
            max-width: 100%;
            width: auto;
            height: auto;
            border-radius: 10px;
            display: block;
            transition: opacity 0.1s ease-out;
        }

        .zoom-wrapper { overflow: hidden; border-radius: var(--radius); }
        .zoom-wrapper canvas { transform-origin: center; }

        /* corner label on each canvas */
        .canvas-tag {
            position: absolute;
            z-index: 3;
            top: 12px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--muted);
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 3px 9px;
            border-radius: 999px;
            -webkit-backdrop-filter: blur(10px) saturate(140%);
            backdrop-filter: blur(10px) saturate(140%);
            pointer-events: none;
            box-shadow: var(--shadow-sm);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        body.has-image .canvas-tag { opacity: 1; }
        .canvas-tag.left-tag,
        .canvas-tag.right-tag { left: 12px; }

        /* ---------- Empty state ---------- */
        .empty-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
            color: var(--muted);
            pointer-events: none;
        }
        body.has-image .empty-state { display: none; }
        .empty-state .drop-ring {
            width: 96px; height: 96px;
            border-radius: 24px;
            display: grid; place-items: center;
            color: var(--accent);
            background: var(--accent-soft);
            border: 2px dashed var(--border-strong);
            animation: float 4s ease-in-out infinite;
        }
        .empty-state h4 { margin: 0; font-size: 16px; color: var(--text); font-weight: 600; }
        .empty-state p { margin: 0; font-size: 13px; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* ---------- Drag chip (follows cursor) ---------- */
        #dragChip {
            position: fixed;
            z-index: 60;
            top: 0; left: 0;
            background: var(--accent);
            color: var(--on-accent);
            font-size: 12px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            padding: 5px 9px;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            transform: translate(14px, -50%);
            transition: opacity 0.1s ease;
            box-shadow: var(--shadow-lg);
            white-space: nowrap;
        }
        #dragChip.show { opacity: 1; }

        /* ---------- Drop overlay ---------- */
        .drop-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(6, 8, 14, 0.55);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 100;
        }
        .drop-overlay.active { opacity: 1; pointer-events: auto; }
        .overlay-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 40px 56px;
            border-radius: 20px;
            border: 2px dashed rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            animation: pulse 1.6s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); border-color: rgba(255,255,255,0.4); }
            50% { transform: scale(1.02); border-color: rgba(255,255,255,0.75); }
        }

        @media screen and (max-width: 1000px) {
            .canvas-box.left, .canvas-tag.left-tag { display: none; }
            .canvas-box.right {
                width: 95%;
                margin: 0 24px;
            }
        }

        /* ============================================================
           GLASS LAYER — frosted surfaces over a soft colored mesh.
           Appended last so these token values win.
           ============================================================ */

        :root {
            --bg: #e8ebee;
            --blob-1: rgba(112, 132, 153, 0.20);
            --blob-2: rgba(201, 211, 220, 0.34);
            --blob-3: rgba(145, 161, 177, 0.15);
            --blob-4: rgba(247, 249, 251, 0.68);
            --panel: rgba(255, 255, 255, 0.64);
            --panel-2: rgba(255, 255, 255, 0.46);
            --canvas-panel-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.46));
            --track: rgba(51, 63, 74, 0.15);
            --text: #27313b;
            --muted: #71808e;
            --accent: #63748a;
            --accent-hover: #53657b;
            --accent-soft: rgba(99, 116, 138, 0.16);
            --on-accent: #ffffff;
            --border: rgba(255, 255, 255, 0.82);
            --border-strong: rgba(51, 63, 74, 0.14);
            --glass-hi: rgba(255, 255, 255, 0.76);
            --blur: 24px;
            --shadow-sm: 0 1px 2px rgba(31, 43, 53, 0.09);
            --shadow-md: 0 10px 32px rgba(31, 43, 53, 0.13);
            --shadow-lg: 0 24px 62px rgba(31, 43, 53, 0.19);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0b0e12;
                --blob-1: rgba(87, 104, 125, 0.20);
                --blob-2: rgba(48, 61, 75, 0.26);
                --blob-3: rgba(35, 45, 57, 0.34);
                --blob-4: rgba(5, 7, 10, 0.55);
                --panel: rgba(17, 22, 29, 0.68);
                --panel-2: rgba(255, 255, 255, 0.045);
                --canvas-panel-bg: linear-gradient(145deg, rgba(31, 38, 48, 0.82), rgba(17, 22, 29, 0.70));
                --track: rgba(255, 255, 255, 0.13);
                --border: rgba(255, 255, 255, 0.12);
                --border-strong: rgba(255, 255, 255, 0.18);
                --glass-hi: rgba(255, 255, 255, 0.10);
                --text: #edf1f5;
                --muted: #9aa7b5;
                --accent: #9bacbf;
                --accent-hover: #b3c3d4;
                --accent-soft: rgba(155, 172, 191, 0.18);
                --on-accent: #0b0e12;
                --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
                --shadow-md: 0 10px 34px rgba(0, 0, 0, 0.50);
                --shadow-lg: 0 24px 70px rgba(0, 0, 0, 0.62);
            }
        }

        :root[data-theme="dark"] {
            --bg: #0b0e12;
            --blob-1: rgba(87, 104, 125, 0.20);
            --blob-2: rgba(48, 61, 75, 0.26);
            --blob-3: rgba(35, 45, 57, 0.34);
            --blob-4: rgba(5, 7, 10, 0.55);
            --panel: rgba(17, 22, 29, 0.68);
            --panel-2: rgba(255, 255, 255, 0.045);
            --canvas-panel-bg: linear-gradient(145deg, rgba(31, 38, 48, 0.82), rgba(17, 22, 29, 0.70));
            --track: rgba(255, 255, 255, 0.13);
            --border: rgba(255, 255, 255, 0.12);
            --border-strong: rgba(255, 255, 255, 0.18);
            --glass-hi: rgba(255, 255, 255, 0.10);
            --text: #edf1f5;
            --muted: #9aa7b5;
            --accent: #9bacbf;
            --accent-hover: #b3c3d4;
            --accent-soft: rgba(155, 172, 191, 0.18);
            --on-accent: #0b0e12;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 10px 34px rgba(0, 0, 0, 0.50);
            --shadow-lg: 0 24px 70px rgba(0, 0, 0, 0.62);
        }

        body { background: var(--bg); }
        body::before {
            content: '';
            position: fixed;
            inset: -10%;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(38% 44% at 14% 12%, var(--blob-1), transparent 72%),
                radial-gradient(42% 42% at 86% 18%, var(--blob-2), transparent 72%),
                radial-gradient(48% 50% at 78% 88%, var(--blob-3), transparent 72%),
                radial-gradient(46% 52% at 16% 90%, var(--blob-4), transparent 72%);
        }

        .controls {
            background: var(--panel);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(165%);
            backdrop-filter: blur(var(--blur)) saturate(165%);
            box-shadow: inset 0 1px 0 var(--glass-hi);
        }

        .card,
        .status {
            -webkit-backdrop-filter: blur(calc(var(--blur) * 0.8)) saturate(150%);
            backdrop-filter: blur(calc(var(--blur) * 0.8)) saturate(150%);
            box-shadow: var(--shadow-md), inset 0 1px 0 var(--glass-hi);
        }
        /* These are the largest surfaces in the app. Keeping them unblurred
           avoids expensive full-panel backdrop recompositing while preserving
           the frosted appearance through the translucent panel color. */
        .canvas-box {
            background: var(--canvas-panel-bg);
            box-shadow: var(--shadow-md), inset 0 1px 0 var(--glass-hi), inset 0 0 0 1px rgba(255, 255, 255, 0.10);
        }

        input[type="number"],
        .offset-modes button,
        .icon-btn {
            -webkit-backdrop-filter: blur(8px) saturate(140%);
            backdrop-filter: blur(8px) saturate(140%);
        }
        .offset-modes button.active {
            -webkit-backdrop-filter: none;
            backdrop-filter: none;
        }

        #download {
            box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255, 255, 255, 0.38);
        }
        #download:hover { box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, 0.45); }

        /* Transparency background — only when the source has real alpha. */
        body.has-alpha.pbg-checker .canvas-box {
            --checker: rgba(128, 132, 148, 0.20);
            background-color: var(--panel-2);
            background-image:
                linear-gradient(45deg, var(--checker) 25%, transparent 25%, transparent 75%, var(--checker) 75%),
                linear-gradient(45deg, var(--checker) 25%, transparent 25%, transparent 75%, var(--checker) 75%);

    </style>

<div id="dragChip"></div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const canvasRepeat = document.getElementById('canvasRepeat');
    const ctxRepeat = canvasRepeat.getContext('2d');
    const marginInput = document.getElementById('margin');
    const repeatInput = document.getElementById('repeat');
    const marginSlider = document.getElementById('marginSlider');
    const repeatSlider = document.getElementById('repeatSlider');
    const offsetModeButtons = document.querySelectorAll('#offsetModes button');
    const seamBlendButtons = document.querySelectorAll('#seamModes button');
    const trimButtons = document.querySelectorAll('#trimModes button');
    const pbgButtons = document.querySelectorAll('#pbgModes button');
    const offsetInput = document.getElementById('offset');
    const offsetSlider = document.getElementById('offsetSlider');
    const overlay = document.getElementById('overlay');
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const downloadBtn = document.getElementById('download');
    const outputStamp = document.getElementById('outputStamp');
    const dragChip = document.getElementById('dragChip');
    const themeToggle = document.getElementById('themeToggle');

    let fileName = 'image';
    let exportType = 'image/jpeg';
    let exportExt = 'jpg';
    const JPEG_QUALITY = 0.92;
    let hasImage = false;
    let hasAlpha = false;
    const DEFAULT_ZOOM = 1;
    const ZOOMED_OUT = 0.5;
    let zoomLevel = DEFAULT_ZOOM;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 5;
    const SNAP = 6; // px window for offset detents
    // Preview-only canvas budget: export output remains full resolution.
    const MAX_REPEAT_PREVIEW_PIXELS = 4 * 1024 * 1024;

    let offset = 0;
    let offsetModeValue = 'center';
    let seamBlend = 'equal'; // 'equal' | 'top' | 'bottom'
    let trimDirection = 'bottom'; // 'bottom' | 'both' | 'top'

    let isDraggingCanvas = false; // right column -> margin
    let startY = 0;
    let startMargin = 0;

    let isDraggingLeft = false;   // left column -> offset
    let startYLeft = 0;
    let startOffset = 0;
    let leftScaleFactor = 1;
    let pendingProcessFrame = 0;

    let img = new Image();
    const zoomWrapper = document.querySelector('.zoom-wrapper');

    ///////////////////////////////////
    /////////// --- Theme --- /////////
    ///////////////////////////////////

    const SUN = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5.2" y1="5.2" x2="7" y2="7"/><line x1="17" y1="17" x2="18.8" y2="18.8"/><line x1="5.2" y1="18.8" x2="7" y2="17"/><line x1="17" y1="7" x2="18.8" y2="5.2"/></svg>';
    const MOON = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z"/></svg>';

    function prefersDark() { return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
    function isDark() {
        const t = document.documentElement.getAttribute('data-theme');
        if (t) return t === 'dark';
        return prefersDark();
    }
    function updateThemeIcon() { themeToggle.innerHTML = isDark() ? SUN : MOON; }

    (function initTheme() {
        try {
            const saved = localStorage.getItem('ir-theme');
            if (saved) document.documentElement.setAttribute('data-theme', saved);
        } catch (e) {}
        updateThemeIcon();
    })();

    themeToggle.onclick = () => {
        const next = isDark() ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('ir-theme', next); } catch (e) {}
        updateThemeIcon();
        if (hasImage) processImage(); // recolor seam markers for the new accent
    };

    ///////////////////////////////////
    //// --- Global drag events --- ///
    ///////////////////////////////////

    ['dragenter', 'dragover'].forEach(eventName => {
        window.addEventListener(eventName, e => {
            e.preventDefault();
            overlay.classList.add('active');
        });
    });

    ['dragleave', 'drop'].forEach(eventName => {
        window.addEventListener(eventName, e => e.preventDefault());
    });

    window.addEventListener('dragleave', e => {
        if (e.clientX === 0 && e.clientY === 0) overlay.classList.remove('active');
    });

    window.addEventListener('drop', e => {
        overlay.classList.remove('active');

        const file = e.dataTransfer.files[0];
        if (!file || !file.type.startsWith('image/')) {
            statusText.innerText = 'Not an image';
            return;
        }

        fileName = file.name.replace(/\.[^/.]+$/, "");
        statusText.innerText = 'Loading…';

        const reader = new FileReader();
        reader.onload = () => { img.src = reader.result; };
        reader.readAsDataURL(file);
    });

    img.onload = () => {
        hasImage = true;
        document.body.classList.add('has-image');
        downloadBtn.disabled = false;

        // Detect real transparency -> keep alpha by exporting PNG (JPEG can't).
        hasAlpha = detectAlpha();
        exportType = hasAlpha ? 'image/png' : 'image/jpeg';
        exportExt = hasAlpha ? 'png' : 'jpg';
        document.body.classList.toggle('has-alpha', hasAlpha);

        zoomLevel = DEFAULT_ZOOM;

        // Offset can span the full image height in either direction.
        const half = Math.floor(img.height / 2);
        offsetSlider.min = -half;
        offsetSlider.max = half;

        // The seam band needs a non-negative core above it.
        const marginCap = Math.floor(img.height / 3);
        marginSlider.max = Math.min(300, marginCap);
        const initialMargin = Math.min(parseInt(marginInput.value) || 0, marginCap);
        marginInput.value = initialMargin;
        marginSlider.value = Math.min(initialMargin, parseInt(marginSlider.max));

        zoomWrapper.querySelector('canvas').style.transform = `scale(${zoomLevel})`;

        statusText.innerText = 'Image loaded';
        statusEl.classList.add('loaded');
        processImage();
    };

    ///////////////////////////////////
    ///////// --- Helpers --- /////////
    ///////////////////////////////////

    function getMargin() {
        const raw = parseInt(marginInput.value) || 0;
        // The output needs an m-tall blend band plus the source core above it.
        const cap = img.height ? Math.max(0, Math.floor(img.height / 3)) : 300;
        return Math.max(0, Math.min(raw, cap));
    }

    // The source loses m rows to make room for the seam band. Choose whether
    // those rows are taken from the top, split evenly, or taken from the bottom.
    function getTrimTop(m) {
        if (trimDirection === 'top') return m;
        if (trimDirection === 'both') return Math.floor(m / 2);
        return 0;
    }

    // Sample the source for any non-opaque pixel (sparse scan for speed).
    function detectAlpha() {
        try {
            const t = document.createElement('canvas');
            t.width = img.width;
            t.height = img.height;
            const tc = t.getContext('2d');
            tc.drawImage(img, 0, 0);
            const data = tc.getImageData(0, 0, img.width, img.height).data;
            const step = Math.max(1, Math.floor((img.width * img.height) / 150000)) * 4;
            for (let i = 3; i < data.length; i += step) {
                if (data[i] < 250) return true;
            }
        } catch (e) {
            return false; // e.g. tainted canvas — assume opaque
        }
        return false;
    }

    // Cyclically shift a finished (already seamless) tile vertically.
    // Applied AFTER blending, so the seam is untouched: a wrap-around shift
    // of a seamless tile is still seamless, so repeatability is preserved.
    function shiftCanvasVertically(cnv, off) {
        const H = cnv.height;
        const W = cnv.width;
        const o = ((off % H) + H) % H;
        if (o === 0) return;

        const tmp = document.createElement('canvas');
        tmp.width = W;
        tmp.height = H;
        const tctx = tmp.getContext('2d');
        tctx.drawImage(cnv, 0, o);
        tctx.drawImage(cnv, 0, o - H);

        const c = cnv.getContext('2d');
        c.clearRect(0, 0, W, H);
        c.drawImage(tmp, 0, 0);
    }

    // The repeat canvas is only a visual inspector. Downscaling it prevents a
    // high-resolution source with several repeats from monopolizing memory.
    function renderRepeatPreview(tileH, repeatCount, blendH = 0) {
        const fullPixels = canvas.width * tileH * repeatCount;
        const scale = fullPixels > MAX_REPEAT_PREVIEW_PIXELS
            ? Math.sqrt(MAX_REPEAT_PREVIEW_PIXELS / fullPixels)
            : 1;
        const previewW = Math.max(1, Math.round(canvas.width * scale));
        const previewH = Math.max(1, Math.round(tileH * repeatCount * scale));

        canvasRepeat.width = previewW;
        canvasRepeat.height = previewH;
        ctxRepeat.clearRect(0, 0, previewW, previewH);
        for (let i = 0; i < repeatCount; i++) {
            const y0 = Math.round(i * tileH * scale);
            const y1 = Math.round((i + 1) * tileH * scale);
            ctxRepeat.drawImage(canvas, 0, 0, canvas.width, tileH, 0, y0, previewW, y1 - y0);
        }
        drawSeamMarkers(tileH * scale, repeatCount, previewW, blendH * scale);
    }

    // Coalesce pointer-drag updates to one full canvas rebuild per frame.
    function scheduleProcessImage() {
        if (pendingProcessFrame) return;
        pendingProcessFrame = requestAnimationFrame(() => {
            pendingProcessFrame = 0;
            processImage();
        });
    }

    function processImageNow() {
        if (pendingProcessFrame) cancelAnimationFrame(pendingProcessFrame);
        pendingProcessFrame = 0;
        processImage();
    }

    // Build the m-tall seam band that makes the tile loop. Three blend modes:
    //   equal  - both edges cross-fade at the same rate
    //   top    - the top edge takes over sooner
    //   bottom - the bottom edge remains visible longer
    // The outgoing strip directly follows the retained core. The incoming strip
    // is the m rows directly before it, so the next tile resumes without a jump.
    function buildSeam(w, m, outgoingY, incomingY) {
        // a strip canvas of m rows sampled from source row sy
        const mk = (sy) => {
            const c = document.createElement('canvas');
            c.width = w; c.height = m;
            c.getContext('2d').drawImage(img, 0, sy, w, m, 0, 0, w, m);
            return c;
        };
        // Scale a strip's alpha by a vertical gradient. Several stops make the
        // top/bottom-biased transition curves visibly distinct for opaque JPEGs.
        const fade = (c, alphaAt) => {
            const cx = c.getContext('2d');
            const g = cx.createLinearGradient(0, 0, 0, m);
            const steps = 16;
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                g.addColorStop(t, `rgba(0,0,0,${alphaAt(t)})`);
            }
            cx.globalCompositeOperation = 'destination-in';
            cx.fillStyle = g;
            cx.fillRect(0, 0, w, m);
            cx.globalCompositeOperation = 'source-over';
            return c;
        };

        const temp = document.createElement('canvas');
        temp.width = w; temp.height = m;
        const tctx = temp.getContext('2d');

        const topWeight = (t) => {
            if (seamBlend === 'top') return 1 - (1 - t) * (1 - t); // ease out
            if (seamBlend === 'bottom') return t * t;               // ease in
            return t;
        };

        // Add premultiplied, complementary alpha contributions. Unlike normal
        // source-over stacking, this never builds extra opacity in PNG seams.
        tctx.drawImage(fade(mk(outgoingY), t => 1 - topWeight(t)), 0, 0);
        tctx.globalCompositeOperation = 'lighter';
        tctx.drawImage(fade(mk(incomingY), topWeight), 0, 0);
        return temp;
    }

    // Small triangular ticks at the centre of each blend band. The band occupies
    // the final `blendH` rows of a tile, not the boundary below it.
    function drawSeamMarkers(tileH, count, w, blendH = 0) {
        if (count < 2) return;
        const acc = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#7c8cff';
        const s = Math.max(6, Math.min(16, w * 0.05));
        ctxRepeat.save();
        ctxRepeat.fillStyle = acc;
        ctxRepeat.globalAlpha = 0.92;
        for (let i = 1; i < count; i++) {
            const y = i * tileH - blendH / 2;
            ctxRepeat.beginPath();
            ctxRepeat.moveTo(0, y - s); ctxRepeat.lineTo(0, y + s); ctxRepeat.lineTo(s, y);
            ctxRepeat.closePath(); ctxRepeat.fill();
            ctxRepeat.beginPath();
            ctxRepeat.moveTo(w, y - s); ctxRepeat.lineTo(w, y + s); ctxRepeat.lineTo(w - s, y);
            ctxRepeat.closePath(); ctxRepeat.fill();
        }
        ctxRepeat.restore();
    }

    ///////////////////////////////////
    ///////// --- Process --- /////////
    ///////////////////////////////////

    function processImage() {
        if (!img.src) return;

        const m = getMargin();
        const w = img.width;
        const h = img.height;
        const newH = h - 2 * m;
        const trimTop = getTrimTop(m);
        const coreStart = trimTop + m;
        const coreH = newH - m;

        // Resolve offset from the selected alignment mode.
        // Center -> no shift; Top -> +m; Bottom -> -m; Custom -> user pixels.
        if (offsetModeValue === 'center') offset = 0;
        else if (offsetModeValue === 'top') offset = m;
        else if (offsetModeValue === 'bottom') offset = -m;
        else offset = parseInt(offsetInput.value) || 0;

        offsetInput.value = offset;
        offsetSlider.value = Math.max(parseInt(offsetSlider.min), Math.min(parseInt(offsetSlider.max), offset));
        marginInput.value = m;
        marginSlider.value = Math.min(m, parseInt(marginSlider.max));

        if (m === 0) {
            canvas.width = w;
            canvas.height = h;
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0);

            // A zero-margin image has no blend band, so its boundary is the seam.
            const repeatCount = Math.max(1, parseInt(repeatInput.value) || 1);
            renderRepeatPreview(h, repeatCount);

            // Offset the result preview + download.
            shiftCanvasVertically(canvas, offset);

            afterProcess();
            return;
        }

        canvas.width = w;
        canvas.height = newH;

        ctx.clearRect(0, 0, w, newH);

        // The retained core moves according to Trim from. The final m rows are
        // replaced by the blend band below, preserving the seamless loop.
        ctx.drawImage(img, 0, coreStart, w, coreH, 0, 0, w, coreH);

        // Seam band (blend mode chosen by the user); replace, don't overlay,
        // so alpha isn't stacked onto the middle underneath.
        const temp = buildSeam(w, m, coreStart + coreH, trimTop);
        ctx.clearRect(0, newH - m, w, m);
        ctx.drawImage(temp, 0, newH - m);

        // --- REPEAT PREVIEW (seam inspection) ---
        // Keep the preview fixed and mark the centre of each visible blend band.
        const repeatCount = Math.max(1, parseInt(repeatInput.value) || 1);
        renderRepeatPreview(newH, repeatCount, m);

        // Offset the finished seamless tile (wrap-around) for the left preview + download.
        shiftCanvasVertically(canvas, offset);

        afterProcess();
    }

    function afterProcess() {
        refreshSliders();
        outputStamp.textContent = `${canvas.width} × ${canvas.height}px · ${exportExt.toUpperCase()}`;
    }

    ///////////////////////////////////
    ////// --- Slider visuals --- /////
    ///////////////////////////////////

    function refreshSliders() {
        [marginSlider, offsetSlider, repeatSlider].forEach(updateSlider);
    }

    function updateSlider(el) {
        const min = parseFloat(el.min), max = parseFloat(el.max);
        const p = max === min ? 0 : (parseFloat(el.value) - min) / (max - min);
        const pct = Math.max(0, Math.min(1, p)) * 100;
        el.style.background = `linear-gradient(to right, var(--accent) 0 ${pct}%, var(--track) ${pct}% 100%)`;

        const wrap = el.closest('.slider-wrap');
        if (!wrap) return;
        const bub = wrap.querySelector('.bubble');
        if (!bub) return;
        bub.textContent = el.value;
        const thumb = 18;
        const x = thumb / 2 + (pct / 100) * (el.clientWidth - thumb);
        bub.style.left = x + 'px';
    }

    // show the bubble while actually dragging a slider thumb
    [marginSlider, offsetSlider, repeatSlider].forEach(el => {
        const wrap = el.closest('.slider-wrap');
        el.addEventListener('pointerdown', () => wrap.classList.add('dragging'));
    });
    window.addEventListener('pointerup', () => {
        document.querySelectorAll('.slider-wrap.dragging').forEach(w => w.classList.remove('dragging'));
    });

    ///////////////////////////////////
    ///////// --- Download --- ////////
    ///////////////////////////////////

    const download = () => {
        if (!hasImage) return;
        const link = document.createElement('a');
        link.download = `${fileName}.${exportExt}`;
        link.href = canvas.toDataURL(exportType, JPEG_QUALITY);
        link.click();
    };

    downloadBtn.onclick = download;

    document.addEventListener('keydown', (e) => {
        // Enter -> re-render + download
        if (e.key === 'Enter' && hasImage) {
            e.preventDefault();
            processImage();
            download();
            return;
        }
        // Shift + Arrow on a number field -> nudge by 10
        if (e.shiftKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
            const t = e.target;
            if (t === marginInput || t === offsetInput || t === repeatInput) {
                e.preventDefault();
                const step = e.key === 'ArrowUp' ? 10 : -10;
                if (t === offsetInput) {
                    applyOffsetValue((parseInt(offsetInput.value) || 0) + step);
                } else {
                    t.value = (parseInt(t.value) || 0) + step;
                    t.dispatchEvent(new Event('input'));
                }
            }
        }
    });

    ///////////////////////////////////
    ///// --- Margin controls --- /////
    ///////////////////////////////////

    marginSlider.oninput = () => {
        marginInput.value = marginSlider.value;
        processImage();
    };
    marginInput.oninput = () => {
        marginSlider.value = marginInput.value;
        processImage();
    };

    repeatSlider.oninput = () => {
        repeatInput.value = repeatSlider.value;
        processImage();
    };
    repeatInput.oninput = () => {
        repeatSlider.value = repeatInput.value;
        processImage();
    };

    ///////////////////////////////////
    ///// --- Offset controls --- /////
    ///////////////////////////////////

    function setOffsetMode(mode, reprocess = true) {
        offsetModeValue = mode;
        offsetModeButtons.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
        if (reprocess) processImage();
    }

    // Central entry point for a raw offset value: snaps to detents
    // (0 / +m / -m) and lights the matching alignment button.
    function applyOffsetValue(raw, reprocess = true) {
        const m = getMargin();
        let val = Math.round(raw);

        const detents = [[0, 'center'], [m, 'top'], [-m, 'bottom']];
        for (const [d, mode] of detents) {
            if (Math.abs(val - d) <= SNAP) {
                offset = d;
                setOffsetMode(mode, reprocess);
                return;
            }
        }
        offset = val;
        offsetInput.value = val;
        offsetSlider.value = Math.max(parseInt(offsetSlider.min), Math.min(parseInt(offsetSlider.max), val));
        setOffsetMode('custom', reprocess);
    }

    offsetModeButtons.forEach(b => {
        b.onclick = () => setOffsetMode(b.dataset.mode);
    });

    // Seam blend mode
    seamBlendButtons.forEach(b => {
        b.onclick = () => {
            seamBlend = b.dataset.blend;
            seamBlendButtons.forEach(x => x.classList.toggle('active', x === b));
            processImage();
        };
    });

    trimButtons.forEach(b => {
        b.onclick = () => {
            trimDirection = b.dataset.trim;
            trimButtons.forEach(x => x.classList.toggle('active', x === b));
            processImage();
        };
    });

    // Preview background (transparent PNGs only; preview-only, export stays clear)
    pbgButtons.forEach(b => {
        b.onclick = () => {
            document.body.classList.remove('pbg-checker', 'pbg-white', 'pbg-black');
            document.body.classList.add('pbg-' + b.dataset.bg);
            pbgButtons.forEach(x => x.classList.toggle('active', x === b));
        };
    });

    offsetSlider.oninput = () => applyOffsetValue(parseInt(offsetSlider.value) || 0);
    offsetInput.oninput = () => applyOffsetValue(parseInt(offsetInput.value) || 0);

    ///////////////////////////////////
    //// --- Drag chip helpers --- ////
    ///////////////////////////////////

    function showChip(x, y, text) {
        dragChip.textContent = text;
        dragChip.style.left = x + 'px';
        dragChip.style.top = y + 'px';
        dragChip.classList.add('show');
    }
    function hideChip() { dragChip.classList.remove('show'); }

    ///////////////////////////////////
    //////////// --- Zoom --- /////////
    ///////////////////////////////////

    zoomWrapper.addEventListener('wheel', (e) => {
        if (!hasImage) return;
        e.preventDefault();
        zoomLevel += (-e.deltaY) * 0.002;
        zoomLevel = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoomLevel));
        zoomWrapper.querySelector('canvas').style.transform = `scale(${zoomLevel})`;
    }, { passive: false });

    zoomWrapper.addEventListener('dblclick', () => {
        zoomLevel = zoomLevel > 0.9 ? ZOOMED_OUT : DEFAULT_ZOOM;
        zoomWrapper.querySelector('canvas').style.transform = `scale(${zoomLevel})`;
    });

    ///////////////////////////////////
    // --- Right canvas -> margin --- /
    ///////////////////////////////////

    zoomWrapper.addEventListener('pointerdown', (e) => {
        if (!hasImage) return;
        isDraggingCanvas = true;
        startY = e.clientY;
        startMargin = parseInt(marginInput.value) || 0;
        document.getElementById('canvas-box-right').classList.add('dragging');
    });

    window.addEventListener('pointermove', (e) => {
        if (!isDraggingCanvas) return;
        const delta = startY - e.clientY;
        let newMargin = Math.round(startMargin + delta * 0.5);
        newMargin = Math.max(0, Math.min(newMargin, 300));
        marginInput.value = newMargin;
        marginSlider.value = newMargin;
        showChip(e.clientX, e.clientY, `Margin ${newMargin}px`);
        scheduleProcessImage();
    });

    window.addEventListener('pointerup', () => {
        if (!isDraggingCanvas) return;
        isDraggingCanvas = false;
        document.getElementById('canvas-box-right').classList.remove('dragging');
        hideChip();
        processImageNow();
    });

    ///////////////////////////////////
    // --- Left canvas -> offset --- //
    ///////////////////////////////////

    const leftBox = document.querySelector('.canvas-box.left');

    leftBox.addEventListener('pointerdown', (e) => {
        if (!hasImage) return;
        isDraggingLeft = true;
        startYLeft = e.clientY;
        startOffset = offset;
        const rect = leftBox.querySelector('canvas').getBoundingClientRect();
        leftScaleFactor = rect.height ? (canvas.height / rect.height) : 1;
        leftBox.classList.add('dragging');
    });

    window.addEventListener('pointermove', (e) => {
        if (!isDraggingLeft) return;
        const delta = e.clientY - startYLeft; // drag down -> shift content down
        const raw = startOffset + delta * leftScaleFactor;
        applyOffsetValue(raw, false);
        const sign = offset > 0 ? '+' : '';
        showChip(e.clientX, e.clientY, `Offset ${sign}${offset}px`);
        scheduleProcessImage();
    });

    window.addEventListener('pointerup', () => {
        if (!isDraggingLeft) return;
        isDraggingLeft = false;
        leftBox.classList.remove('dragging');
        hideChip();
        processImageNow();
    });

    // init slider fills on first paint
    refreshSliders();

</script>

</body>
</html>
